<!doctype html>
<html lang="th">

<head>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gem Dominion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sarabun:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="gem_dominion_style.css?v=3">
</head>

<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="crown">♛</div>
        <h1>Gem Dominion</h1>
        <small>MINE · TRADE · PRESTIGE</small>
      </div>
      <div class="top-actions">
        <!-- เพิ่มกล่องโชว์รหัสห้องด้านบน -->
        <div
          style="color: #e3b84f; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; border: 1px solid #a87a2a;">
          รหัสห้อง: <span id="displayRoomId">----</span>
        </div>
        <span class="pill" id="turnPill"></span>
        <button class="icon-btn wide"
          onclick="if(confirm('ต้องการออกจากห้องหรือไม่?')) window.location.href='../dashboard/index.html'">⎋
          ออกจากเกม</button>
      </div>
      <div style="color: #e3b84f; font-weight: bold; margin-right: 15px;">
        รหัสห้อง: <span id="displayRoomId">----</span>
      </div>
    </header>

    <div class="layout">
      <aside id="players"></aside>

      <main class="board">
        <div id="market"></div>
        <div class="noble-row">
          <div class="deck noble-deck"><b>ขุนนาง (Noble)</b><span id="nobleCount"></span></div>
          <div class="nobles" id="nobles"></div>
        </div>
        <div class="bank" id="tokens"></div>
      </main>

      <aside class="side">
        <section class="parch" id="me"></section>
        <section class="parch action" id="action"></section>
        <section class="parch log" id="log"></section>
      </aside>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="waitingOverlay" class="waiting-overlay">
    <div class="waiting-box">
      <h2 id="waitingTitle">รอผู้เล่น...</h2>
      <p style="color: #bfa985; margin-bottom: 20px;">รหัสห้อง: <b id="overlayRoomId"
          style="color: #fff; font-size: 18px;">----</b></p>

      <div id="waitingPlayersList" class="waiting-players"></div>

      <button id="startGameBtn" class="btn primary"
        style="display: none; margin-top: 20px; font-size: 18px; padding: 12px 30px;">
        ▶ เริ่มเกม
      </button>
    </div>
  </div>
  <script src="gem_dominion_script.js?v=3"></script>
  <script src="gem_dust.js" data-scale="0.6"></script>
</body>

</html>
