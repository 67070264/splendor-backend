<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เทสระบบ ห้องเกม (Lobby)</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>1. ระบบจัดการห้อง (Lobby)</h2>
    <input type="text" id="playerName" placeholder="พิมพ์ชื่อคุณ..." style="padding: 5px;">
    <button onclick="createRoom()" style="padding: 5px;">🏠 สร้างห้องใหม่</button>
    <br><br>
    
    <input type="text" id="roomCodeInput" placeholder="รหัสห้อง 6 หลัก" style="padding: 5px;">
    <button onclick="joinRoom()" style="padding: 5px;">🚶‍♂️ เข้าร่วมห้อง</button>
    
    <!-- ปุ่มเริ่มเกม -->
    <button onclick="startGame()" style="padding: 5px; color: green; font-weight: bold; margin-left: 10px;">▶️ เริ่มเกม</button>

    <hr>
    <h2>2. ข้อมูลปัจจุบัน</h2>
    <p><b>รหัสห้องของคุณ:</b> <span id="displayRoomId" style="color: blue; font-size: 20px;">ยังไม่มีห้อง</span></p>
    <p><b>จำนวนคนในห้อง:</b> <span id="displayPlayers">0</span> / 4</p>

    <!-- กล่องรวมปุ่มแอ็กชัน จะโชว์ก็ต่อเมื่อเข้าห้องแล้ว -->
    <div id="gameActions" style="display: none; background: #eee; padding: 10px; margin-top: 20px;">
        <h3>แอ็กชันทดสอบ (ต้องอยู่ในห้องและกดเริ่มเกมแล้ว)</h3>
        
        <button onclick="testTake2Gems()" style="padding: 10px; margin: 5px;">✅ เทสหยิบ 2 มรกต</button>
        
        <!-- 🌟 ปุ่มเทสซื้อการ์ดที่เพิ่มกลับเข้ามา -->
        <button onclick="testBuyCard()" style="padding: 10px; margin: 5px; color: green;">💳 เทสซื้อการ์ด (ใบแรกสุดของ Tier 1)</button>

        <button onclick="testForceWin()" style="padding: 10px; margin: 5px; background: red; color: white; font-weight: bold; border: none; border-radius: 5px;">🔥 สูตรโกง: เสก 15 แต้ม (เทส DynamoDB)</button>
    </div>

    <script>
        const socket = io('http://localhost:3000');
        let myRoomId = null; 
        let currentBoard = null; // 🌟 ตัวแปรใหม่ เอาไว้จำสภาพกระดานล่าสุด

        socket.on('connect', () => console.log('🟢 เชื่อมต่อสำเร็จ ID:', socket.id));

        // เมื่อสร้างห้องสำเร็จ
        socket.on('roomCreated', (data) => {
            myRoomId = data.roomId;
            document.getElementById('displayRoomId').innerText = myRoomId;
            document.getElementById('displayPlayers').innerText = data.gameState.players.length;
            document.getElementById('gameActions').style.display = "block";
        });

        // เมื่อเกมเริ่ม
        socket.on('gameStarted', (msg) => {
            alert("🎮 " + msg);
        });

        // เมื่อมีอัปเดตข้อมูลกระดาน
        socket.on('updateBoard', (newGameState) => {
            currentBoard = newGameState.board; // อัปเดตข้อมูลกระดานในหน้าเว็บ
            document.getElementById('displayPlayers').innerText = newGameState.players.length;
            console.log('✅ กระดานอัปเดต:', newGameState);
        });

        socket.on('errorMsg', (msg) => alert('❌ Error: ' + msg));

        // --- ฟังก์ชัน UI ---
        function createRoom() {
            const name = document.getElementById('playerName').value;
            socket.emit('createRoom', name);
        }

        function joinRoom() {
            const name = document.getElementById('playerName').value;
            const code = document.getElementById('roomCodeInput').value;
            myRoomId = code; 
            
            socket.emit('joinRoom', { roomId: code, playerName: name });
            
            document.getElementById('displayRoomId').innerText = code;
            document.getElementById('gameActions').style.display = "block";
        }

        function startGame() {
            if (!myRoomId) return alert("ต้องสร้างหรือเข้าห้องก่อน!");
            socket.emit('startGame', myRoomId);
        }

        // --- ฟังก์ชัน Action ในเกม ---
        function testTake2Gems() {
            socket.emit('playerTakeGems', { 
                roomId: myRoomId, 
                playerId: socket.id, 
                selectedGems: ["emerald", "emerald"] 
            });
        }

        // 🌟 ฟังก์ชันเทสซื้อการ์ด (ดึง ID อัตโนมัติจากกระดาน)
        function testBuyCard() {
            if (!currentBoard || currentBoard.cardsOnBoard.tier1.length === 0) {
                return alert("⚠️️ ไม่มีการ์ดบนกระดาน! (กดปุ่ม '▶️ เริ่มเกม' หรือยัง?)");
            }

            // แอบดู ID ของการ์ดใบซ้ายสุดใน Tier 1
            const targetCardId = currentBoard.cardsOnBoard.tier1[0].id;

            socket.emit('buyCard', {
                roomId: myRoomId,
                playerId: socket.id,
                cardId: targetCardId,
                tier: 1
            });
        }

        function testForceWin() {
            if (!confirm("แน่ใจนะว่าจะใช้สูตรโกงเพื่อจบเกม?")) return;
            socket.emit('forceWin', myRoomId);
        }
        
    </script>
</body>
</html>
